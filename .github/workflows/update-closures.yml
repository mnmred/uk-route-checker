name: Daily Route Closure Downloader

on:
  schedule:
    # Runs automatically every day at 04:00 AM UTC
    - cron: '0 4 * * *'
  workflow_dispatch: # Adds a button so you can run it manually anytime

jobs:
  download-and-save:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Allows the bot to save the file to your repo

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v3

      - name: Download the Excel file from National Highways
        run: |
          curl -L -o closures.xlsx "https://nationalhighways.co.uk/media/ufshmlno/7-day-closure-report.xlsx"

      - name: Commit and push the updated file
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add closures.xlsx
          # Only commit if the file has actually changed
          git commit -m "Automated update: Downloaded latest closures.xlsx" || exit 0
          git push
